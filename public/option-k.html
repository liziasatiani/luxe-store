<!DOCTYPE html>
<html lang="ka" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Everything Street — Option K: Night Market × Editorial Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Outfit:wght@200;300;400;500;600;700&family=Noto+Serif+Georgian:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/*
  HYBRID G — "NIGHT MARKET"

  Best of D + E + F:
  D → Split-screen hero, category color identity (blue for tech / crimson for beauty), stats bar
  E → Playfair Display warmth, editorial hover panels, Georgian script as display art
  F → Deep navy base, gold accent system, transparent scroll nav, cinematic hero treatment,
       feature strip, marquee, quote-style testimonials, two-column newsletter

  Result: A dark luxury marketplace with two clear category worlds,
  warm serif typography, and gold as the unifying currency of premium.
*/

:root {
  --bg:      #07090F;
  --s1:      #0D1220;
  --s2:      #131929;
  --s3:      #1A2235;
  --gold:    #C9A44A;
  --gold2:   rgba(201,164,74,0.18);
  --gold3:   rgba(201,164,74,0.07);
  --blue:    #00E5FF;
  --blue2:   rgba(0,229,255,0.12);
  --crimson: #FF3366;
  --crimson2:rgba(255,51,102,0.12);
  --chalk:   #EFE9DA;
  --chalk2:  rgba(239,233,218,0.55);
  --chalk3:  rgba(239,233,218,0.15);
  --border:  rgba(239,233,218,0.08);
  --borderg: rgba(201,164,74,0.18);
  --nav-h:   68px;
  --serif:   'Playfair Display', Georgia, serif;
  --ka:      'Noto Serif Georgian', serif;
  --sans:    'Outfit', system-ui, sans-serif;
}
[data-theme="light"] {
  --bg:      #F4F0E8;
  --s1:      #EDE7D8;
  --s2:      #E5DDCC;
  --s3:      #DDD4BF;
  --chalk:   #1A1208;
  --chalk2:  rgba(26,18,8,0.55);
  --chalk3:  rgba(26,18,8,0.15);
  --border:  rgba(26,18,8,0.09);
  --borderg: rgba(201,164,74,0.25);
  --gold3:   rgba(201,164,74,0.06);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--chalk);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
img{display:block;max-width:100%;object-fit:cover}
a{color:inherit;text-decoration:none;cursor:pointer}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}

/* NAV */
.ann-bar{position:fixed;top:0;left:0;right:0;z-index:201;height:32px;background:transparent;border-bottom:1px solid rgba(255,255,255,.06);overflow:hidden;white-space:nowrap;display:flex;align-items:center;transform:translateY(-100%);transition:transform .4s cubic-bezier(.4,0,.2,1)}
.ann-bar.visible{transform:translateY(0)}
.ann-track{display:inline-flex;align-items:center;animation:marquee 32s linear infinite}
.ann-track:hover{animation-play-state:paused}
.ann-item{font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5);padding:0 36px;white-space:nowrap}
.ann-item strong{color:var(--gold);font-weight:600}
.ann-sep{color:rgba(255,255,255,.15);font-size:8px}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
#nav{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--nav-h);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 44px;transition:background .4s,border-color .4s,backdrop-filter .4s,top .4s cubic-bezier(.4,0,.2,1);border-bottom:1px solid transparent}
#nav.ann-shown{top:32px}
#nav.solid{background:rgba(7,9,15,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom-color:var(--border)}
[data-theme="light"] #nav.solid{background:rgba(244,240,232,.9)}
.nav-left{display:flex;align-items:center;gap:20px}
.nav-right{display:flex;align-items:center;gap:16px;justify-content:flex-end}
.logo{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.02em;color:var(--chalk)}
.logo em{color:var(--gold);font-style:italic}
.nav-sep{width:1px;height:14px;background:var(--borderg);opacity:.5}
.lang-drop{position:relative}
.lang-chip{font-size:11px;font-weight:600;letter-spacing:.12em;padding:6px 14px;border-radius:20px;border:1px solid var(--borderg);color:var(--gold);transition:all .2s;display:flex;align-items:center;gap:5px;cursor:pointer}
.lang-chip:hover{background:var(--gold2)}
.lang-chip svg{opacity:.6}
.lang-menu{position:absolute;top:calc(100% + 10px);left:0;background:rgba(7,9,15,.96);backdrop-filter:blur(20px);border:1px solid var(--borderg);border-radius:4px;overflow:hidden;min-width:100px;display:none;z-index:300}
[data-theme="light"] .lang-menu{background:rgba(244,240,232,.97)}
.lang-drop.open .lang-menu{display:block}
.lang-opt{display:block;width:100%;padding:10px 16px;font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--chalk2);text-align:left;transition:color .15s,background .15s;cursor:pointer}
.lang-opt:hover{color:var(--chalk);background:rgba(255,255,255,.04)}
.lang-opt.active{color:var(--gold)}
.nav-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--chalk2);transition:color .2s;cursor:pointer}
.nav-icon:hover{color:var(--chalk)}
.cart-wrap{position:relative}
.cart-pip{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--gold);display:none}
.signin-btn{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border:1px solid var(--borderg);border-radius:20px;color:var(--gold);transition:all .2s;cursor:pointer}
.signin-btn:hover{background:var(--gold2)}

/* HERO — split screen */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;position:relative}
.hero-half{position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:72px 56px;cursor:pointer}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.28);transition:filter .6s,transform .8s cubic-bezier(.4,0,.2,1)}
.hero-half:hover .hero-bg{filter:brightness(.38);transform:scale(1.04)}
.hero-tech .hero-bg{background-image:url('https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=900&q=85&auto=format')}
.hero-beauty .hero-bg{background-image:url('https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=900&q=85&auto=format')}
.hero-tint{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.hero-tech .hero-tint{background:linear-gradient(135deg,rgba(0,229,255,.18) 0%,transparent 70%)}
.hero-beauty .hero-tint{background:linear-gradient(135deg,rgba(255,51,102,.18) 0%,transparent 70%)}
.hero-half:hover .hero-tint{opacity:1}
.hero-shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,9,15,.85) 0%,transparent 55%)}
.hero-divider{position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(239,233,218,.12);z-index:2}
.hero-content{position:relative;z-index:1;animation:rise .8s ease both}
.hero-content.delay{animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.hero-tag{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.hero-tech .hero-tag{color:var(--blue)}
.hero-beauty .hero-tag{color:var(--crimson)}
.hero-tag::before{content:'';display:block;width:22px;height:1px;background:currentColor}
.hero-title{font-family:var(--serif);font-size:clamp(40px,5.5vw,80px);font-weight:700;line-height:.95;letter-spacing:-.02em;color:#fff;margin-bottom:14px}
.hero-title-ka{font-family:var(--ka);font-size:clamp(26px,3.5vw,52px);font-weight:400;line-height:1.2;color:rgba(255,255,255,.55);margin-bottom:28px}
.hero-sub{font-size:13px;color:rgba(255,255,255,.6);max-width:280px;line-height:1.65;margin-bottom:32px}
.hero-cta{display:inline-flex;align-items:center;gap:10px;padding:13px 28px;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:1px;color:#fff;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);transition:all .25s}
.hero-tech .hero-cta:hover{background:var(--blue);border-color:var(--blue)}
.hero-beauty .hero-cta:hover{background:var(--crimson);border-color:var(--crimson)}
.hero-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;text-align:center;pointer-events:none}
.hero-brand{font-family:var(--serif);font-size:13px;font-weight:400;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.5)}

/* MARQUEE */
.marquee{background:var(--gold3);border-top:1px solid var(--borderg);border-bottom:1px solid var(--borderg);height:50px;overflow:hidden;display:flex;align-items:center}
.mq-track{display:flex;animation:mq 32s linear infinite;white-space:nowrap}
.mq-track span{padding:0 36px;font-family:var(--serif);font-size:13px;font-weight:400;font-style:italic;color:var(--gold);opacity:.85}
.mq-track .dot{font-style:normal;font-size:8px;opacity:.4}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.stat{padding:32px 44px;border-right:1px solid var(--border)}
.stat:last-child{border-right:none}
.stat-n{font-family:var(--sans);font-size:44px;font-weight:700;line-height:1;letter-spacing:-.03em;margin-bottom:6px}
.stat-n.tech{color:var(--gold)}
.stat-n.beauty{color:var(--gold)}
.stat-n.gold{color:var(--chalk)}
.stat-l{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk2)}

/* SECTION */
.wrap{max-width:1400px;margin:0 auto;padding:0 52px}
.section{padding:96px 0}
.sec-meta{margin-bottom:60px}
.sec-eyebrow{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.sec-title{font-family:var(--serif);font-size:clamp(32px,3.5vw,52px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
.sec-row{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.see-all{font-size:11px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px;flex-shrink:0;border-bottom:1px solid var(--borderg);padding-bottom:3px;transition:opacity .2s}
.see-all::after{content:'→'}
.see-all:hover{opacity:.7}

/* PRODUCT GRID */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1px;background:var(--border)}
.pcard{background:var(--bg);cursor:pointer;transition:background .25s}
.pcard:hover{background:var(--s1)}
.pimg{aspect-ratio:3/4;overflow:hidden;position:relative;background:var(--s1)}
.pimg img{width:100%;height:100%;object-fit:cover;filter:saturate(.75) brightness(.95);transition:transform .7s cubic-bezier(.4,0,.2,1),filter .4s}
.pcard:hover .pimg img{transform:scale(1.06);filter:saturate(.9) brightness(1)}
.pbadge{position:absolute;top:18px;left:18px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:5px 12px;border-radius:1px}
.bt{background:var(--blue2);color:#00E5FF;border:1px solid rgba(0,229,255,.25)}
.bb{background:var(--crimson2);color:#FF3366;border:1px solid rgba(255,51,102,.25)}
.bn{background:var(--gold);color:#000}
.pbody{padding:22px 26px 28px}
.pbrand{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--chalk2);margin-bottom:7px}
.pname{font-family:var(--serif);font-size:18px;font-weight:400;line-height:1.25;margin-bottom:14px}
.prow{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.pprice{font-size:19px;font-weight:500;font-family:var(--sans)}
.pold{font-size:13px;color:var(--chalk2);text-decoration:line-through;opacity:.6}
.pacts{display:flex;gap:8px}
.btn-cart{flex:1;padding:12px;background:transparent;border:1px solid var(--borderg);color:var(--gold);font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-radius:1px;transition:all .25s}
.btn-cart:hover{background:var(--gold);color:#000;border-color:var(--gold)}
.btn-wish{width:44px;height:44px;border:1px solid var(--border);border-radius:1px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--chalk2);transition:all .2s}
.btn-wish:hover{border-color:var(--crimson);color:var(--crimson)}

/* FEATURE STRIP */
.fstrip{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--gold3)}
.fstrip-inner{max-width:1400px;margin:0 auto;padding:0 52px;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.fitem{padding:44px 32px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.fitem:last-child{border-right:none}
.ficon{font-size:22px;color:var(--gold)}
.ftitle{font-family:var(--serif);font-size:17px;font-weight:500;line-height:1.2}
.fdesc{font-size:12px;color:var(--chalk2);line-height:1.6}

/* EDITORIAL PANELS (from E, refined) */
.epanels{display:grid;grid-template-columns:1fr 1fr}
.epanel{position:relative;overflow:hidden;min-height:520px;cursor:pointer;display:flex;align-items:flex-end;padding:56px 64px}
.ep-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.25);transition:filter .55s,transform .75s cubic-bezier(.4,0,.2,1)}
.epanel:hover .ep-bg{filter:brightness(.38);transform:scale(1.04)}
.ep-tech .ep-bg{background-image:url('https://images.unsplash.com/photo-1468495244123-6c6c332eeece?w=900&q=80&auto=format')}
.ep-beauty .ep-bg{background-image:url('https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=900&q=80&auto=format')}
.ep-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,9,15,.9) 0%,transparent 65%)}
.ep-accent{position:absolute;inset:0;opacity:0;transition:opacity .4s}
.ep-tech .ep-accent{background:linear-gradient(135deg,rgba(0,229,255,.15) 0%,transparent 60%)}
.ep-beauty .ep-accent{background:linear-gradient(135deg,rgba(255,51,102,.15) 0%,transparent 60%)}
.epanel:hover .ep-accent{opacity:1}
.ep-content{position:relative;z-index:1}
.ep-cat{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.ep-title{font-family:var(--serif);font-size:clamp(30px,3.5vw,52px);font-weight:700;line-height:1.05;margin-bottom:12px}
.ep-sub{font-size:13px;color:var(--chalk2);line-height:1.6;max-width:320px;margin-bottom:28px}
.ep-link{display:inline-flex;align-items:center;gap:10px;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--borderg);padding-bottom:4px;transition:border-color .2s}
.epanel:hover .ep-link{border-color:var(--gold)}

/* EDITORIAL PANELS */
.editorial{border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr}
.ed-img{overflow:hidden;aspect-ratio:4/3;background:var(--s1)}
.ed-img img{width:100%;height:100%;object-fit:cover;filter:saturate(.8) brightness(.9);transition:transform .9s cubic-bezier(.4,0,.2,1),filter .5s}
.editorial:hover .ed-img img{transform:scale(1.03);filter:saturate(.9) brightness(.95)}
.ed-txt{padding:80px 72px;display:flex;flex-direction:column;justify-content:center}
.ed-ey{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:28px}
.ed-title{font-family:var(--serif);font-size:clamp(32px,3.5vw,52px);font-weight:700;line-height:1.05;letter-spacing:-.02em;margin-bottom:22px;color:var(--chalk)}
.ed-title em{font-style:italic;color:var(--gold)}
.ed-desc{font-size:14px;color:var(--chalk2);line-height:1.75;max-width:380px;margin-bottom:36px}
.ed-link{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:inline-flex;align-items:center;gap:10px;border-bottom:1px solid rgba(var(--gold-rgb),.3);padding-bottom:4px;transition:opacity .2s;cursor:pointer}
.ed-link:hover{opacity:.7}
.ed-link::after{content:'→'}
.editorial.flip .ed-img{order:2}

/* NEWSLETTER — two column (F) */
.nl-section{border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.nl-inner{max-width:1200px;margin:0 auto;padding:80px 52px;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.nl-title{font-family:var(--serif);font-size:clamp(28px,3vw,44px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin-bottom:12px}
.nl-desc{font-size:13px;color:var(--chalk2);line-height:1.7}
.nl-form{display:flex;gap:10px}
.nl-input{flex:1;padding:14px 18px;background:transparent;border:1px solid var(--borderg);border-radius:2px;color:var(--chalk);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .2s}
.nl-input:focus{border-color:var(--gold)}
.nl-input::placeholder{color:var(--chalk3)}
.nl-btn{padding:14px 28px;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border-radius:2px;transition:all .2s;white-space:nowrap}
.nl-btn:hover{background:var(--gold);color:#000}
.nl-note{font-size:10px;color:var(--chalk3);margin-top:12px}

/* PRODUCTS PAGE */
.page-header{padding:calc(var(--nav-h) + 60px) 52px 48px;max-width:1400px;margin:0 auto;border-bottom:1px solid var(--border)}
.page-title{font-family:var(--serif);font-size:clamp(48px,7vw,96px);font-weight:700;line-height:.95;letter-spacing:-.03em}
.page-title em{font-style:italic;color:var(--gold)}
.page-count{font-size:13px;color:var(--chalk2);margin-top:14px}
.shop-wrap{display:grid;grid-template-columns:280px 1fr;max-width:1400px;margin:0 auto}
.sidebar{border-right:1px solid var(--border);padding:44px 32px;position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));overflow-y:auto}
.sidebar::-webkit-scrollbar{width:2px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border)}
.fg{margin-bottom:36px}
.fg-head{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--borderg)}
.frow{display:flex;align-items:center;gap:11px;padding:9px 0;cursor:pointer;font-size:13px;color:var(--chalk2);transition:color .2s}
.frow:hover{color:var(--chalk)}
.fbox{width:16px;height:16px;border:1px solid var(--borderg);border-radius:1px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
.frow.on .fbox{background:var(--gold);border-color:var(--gold);color:#000}
.frow.on{color:var(--chalk)}
.fcount{margin-left:auto;font-size:11px;opacity:.45}
.pf-in{width:100%;padding:11px 15px;background:var(--s1);border:1px solid var(--border);border-radius:1px;color:var(--chalk);font-family:var(--sans);font-size:13px;outline:none;margin-bottom:10px;transition:border-color .2s}
.pf-in:focus{border-color:var(--gold)}
.srt-bar{display:flex;align-items:center;gap:24px;padding:20px 44px;border-bottom:1px solid var(--border)}
.srt{font-size:11px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--chalk2);cursor:pointer;padding-bottom:2px;transition:color .2s}
.srt.on{color:var(--gold);border-bottom:1px solid var(--gold)}
.srt:hover:not(.on){color:var(--chalk)}
.main-area{padding:36px 44px}

/* PRODUCT DETAIL */
.dlayout{display:grid;grid-template-columns:1fr 1fr;max-width:1400px;margin:0 auto;padding-top:var(--nav-h);min-height:calc(100vh - var(--nav-h))}
.dgallery{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));display:flex;flex-direction:column;gap:8px;padding:32px 28px}
.dmain{flex:1;background:var(--s1);border:1px solid var(--border);border-radius:1px;overflow:hidden}
.dmain img{width:100%;height:100%;object-fit:cover}
.dthumbs{display:flex;gap:8px;height:74px}
.dthumb{flex:1;background:var(--s1);border:1px solid var(--border);border-radius:1px;overflow:hidden;cursor:pointer;opacity:.4;transition:opacity .2s,border-color .2s}
.dthumb.on{opacity:1;border-color:var(--gold)}
.dthumb img{width:100%;height:100%;object-fit:cover}
